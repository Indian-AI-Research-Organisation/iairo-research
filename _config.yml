title: IAIRO Research Projects
email: contact@iairo.ai
description: >-
  IAIRO Research Projects Hub. Indian AI Research Organisation — building India's frontier AI capabilities through research, ecosystem bridging, and deployment of AI solutions for Pharma, Health, Sustainability, and Education.
baseurl: "/iairo-research"
url: ""

organization:
  name: IAIRO
  website: https://iairo.ai/
  newsletter: https://www.linkedin.com/newsletters/align-with-iairo-7456981725294804992/
  tagline: Indian AI Research Organisation
  research_focus: "Pharma, Health, Sustainability, and Education"
  location: Gift City, Gujarat, India
  mission: "IAIRO is pioneering new types of sovereign AI for India. From Consumer AI to Enterprise AI. From Big AI to Small AI."
  logo: /assets/images/IAIRO.jpeg

hero:
  heading: IAIRO Research Projects
  subheading: A curated view of ongoing and completed work across enterprise and foundation AI.
  cta_text: Visit IAIRO
  cta_link: https://iairo.ai/

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
      status: active
      featured: false

markdown: kramdown
highlighter: rouge
permalink: pretty

theme: minima

plugins:
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - vendor/bundle
